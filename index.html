  color-scheme: light dark;
  --ink:#16191d; --body:#41484f; --faint:#7b848d; --line:#e6e9ed;
  --paper:#fff; --sheet:#fff; --wash:#f6f7f9; --accent:#1f6feb; --tint:none;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eef1f4; --body:#b3bcc5; --faint:#7d868f; --line:#262b31;
    --paper:#0d0f12; --sheet:#14171b; --wash:#1a1e23; --accent:#6ea8fe;
    --tint: invert(1); --shadow:none;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:16px; line-height:1.85;
  word-break:keep-all; overflow-wrap:break-word;
}

/* 위에 붙어 따라다니는 줄 — 지금 어느 문서를 보는지와 다른 문서로 가는 길 */
.bar{
  position:sticky; top:0; z-index:10; border-bottom:1px solid var(--line);
  background:var(--paper);                                  /* 못 알아듣는 브라우저용 */
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
}
.bar>div{
  max-width:760px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:14px;
}
.bar .mark{width:70px; height:17px; opacity:.9}
.bar nav{margin-left:auto; display:flex; gap:4px}
.bar a{
  font-size:13px; text-decoration:none; color:var(--faint);
  padding:5px 11px; border-radius:999px; white-space:nowrap;
}
.bar a:hover{color:var(--ink); background:var(--wash)}
.bar a[aria-current]{color:var(--ink); background:var(--wash); font-weight:600}

main{max-width:760px; margin:0 auto; padding:0 20px 96px}

.mark{
  background:var(--logo) no-repeat left center/contain;
  filter:var(--tint); flex:none;
}

/* 표지 */
header{padding:64px 0 40px; border-bottom:1px solid var(--line)}
header .mark{width:140px; height:34px; margin-bottom:26px}
h1{margin:0; font-size:34px; line-height:1.25; letter-spacing:-.02em; color:var(--ink); font-weight:700}
header p{margin:14px 0 0; font-size:15px; max-width:56ch}
.stamp{
  display:inline-flex; align-items:center; gap:7px; margin-top:22px;
  font-size:12.5px; color:var(--faint);
  border:1px solid var(--line); border-radius:999px; padding:5px 13px;
}
.stamp b{color:var(--ink); font-weight:600}
.dot{width:5px; height:5px; border-radius:50%; background:var(--accent)}

/* 목차 */
.toc{margin:36px 0 0; padding:22px 24px; background:var(--sheet); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow)}
.toc h2{margin:0 0 12px; font-size:12px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--faint); font-weight:700}
.toc ol{margin:0; padding:0; list-style:none; columns:2; column-gap:28px}
.toc li{break-inside:avoid; margin:0 0 7px}
.toc a{color:var(--body); text-decoration:none; font-size:14.5px;
  border-bottom:1px solid transparent}
.toc a:hover{color:var(--accent); border-color:currentColor}
@media(max-width:560px){ .toc ol{columns:1} }

/* 본문 */
section{padding:44px 0 4px; border-bottom:1px solid var(--line); scroll-margin-top:64px}
section:last-of-type{border-bottom:0}
h2.title{
  margin:0 0 20px; font-size:21px; line-height:1.4; letter-spacing:-.01em;
  color:var(--ink); font-weight:700;
}
h3{margin:26px 0 5px; font-size:15.5px; color:var(--ink); font-weight:650; letter-spacing:-.005em}
h3:first-of-type{margin-top:0}
p{margin:0 0 2px; font-size:15.5px}
.note{
  margin:22px 0 4px; padding:14px 16px; background:var(--wash); border-radius:10px;
  font-size:14px; color:var(--faint); line-height:1.75;
}
ul{margin:8px 0 0; padding:0; list-style:none}
ul li{position:relative; padding-left:18px; margin:0 0 5px; font-size:15.5px}
ul li::before{
  content:""; position:absolute; left:2px; top:.72em;
  width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.55;
}

/* 사업자 정보 — 읽을 글이 아니라 찾아보는 칸이라 작고 흐리게 둔다 */
dl{display:grid; grid-template-columns:auto 1fr; gap:0; margin:4px 0 0; font-size:13.5px;
  line-height:1.6}
dt{color:var(--faint); padding:9px 22px 9px 0; border-top:1px solid var(--line); white-space:nowrap}
dd{margin:0; padding:9px 0; border-top:1px solid var(--line); color:var(--body)}
dd a{color:var(--body); text-decoration:none; border-bottom:1px solid var(--line)}
dd a:hover{color:var(--accent); border-color:currentColor}
dl>dt:first-of-type,dl>dt:first-of-type+dd{border-top:0}
@media(max-width:520px){
  dl{grid-template-columns:1fr}
  dt{padding:10px 0 0; border-top:1px solid var(--line)}
  dd{padding:0 0 10px; border-top:0}
  dl>dt:first-of-type+dd{border-top:0}
}

footer{padding:40px 0 0; font-size:13.5px; color:var(--faint)}
footer a{color:var(--faint)}

/* 목록 페이지 */
.cards{display:grid; gap:14px; margin-top:34px}
.card{
  display:block; text-decoration:none; padding:22px 24px; border:1px solid var(--line);
  border-radius:14px; background:var(--sheet); box-shadow:var(--shadow);
}
.card:hover{border-color:var(--accent)}
.card strong{display:block; color:var(--ink); font-size:17px; font-weight:650; letter-spacing:-.01em}
.card span{display:block; margin-top:5px; font-size:14px; color:var(--faint)}

@media print{
  .bar,.toc{display:none}
  body{font-size:11pt; color:#000; background:#fff}
  section{break-inside:avoid; border-color:#ddd}
  header{padding-top:0}
}
</style>
